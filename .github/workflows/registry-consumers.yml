name: Registry consumers

on:
  pull_request:
    paths:
      - '.github/workflows/registry-consumers.yml'
      - 'packages/**'
      - 'scripts/**'
      - 'registry.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/registry-consumers.yml'
      - 'packages/**'
      - 'scripts/**'
      - 'registry.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  consumer-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0 # the floating v6 tag predates pnpm 12 support

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The Bun fixture installs through bunx and `bun install --linker isolated`.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Base UI runtime checks
        run: pnpm dlx playwright@1.64.1 install --with-deps chromium

      - name: Build and test clean shadcn consumers
        run: pnpm registry:consumer-test
